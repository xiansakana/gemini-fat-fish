<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胖蓝 · Gemini 大肥鱼</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #131d2e;
    --panel-2: #1a273c;
    --line: #2b3b54;
    --text: #e8f0fa;
    --muted: #93a6c0;
    --blue: #53a8ff;
    --blue-2: #2d6fd1;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1100px 600px at 12% -10%, #17325a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,.28);
  }
  .tank {
    padding: 22px;
    text-align: center;
    position: sticky;
    top: 28px;
  }
  .tank h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .tank .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .fish-wrap { position: relative; height: 210px; overflow: hidden; border-radius: 14px;
    background: linear-gradient(180deg, #102544 0%, #0d1c33 100%); border: 1px solid var(--line); }
  .bubble { position:absolute; border:1px solid rgba(160,210,255,.35); border-radius:50%; opacity:.5;
    animation: rise 6s linear infinite; }
  @keyframes rise { from { transform: translateY(30px); opacity:0 } 30% {opacity:.55} to { transform: translateY(-190px); opacity:0 } }
  .fish { width: 190px; margin: 54px auto 0; animation: swim 3.4s ease-in-out infinite; transform-origin: center; }
  .fish.thinking { animation: think .5s ease-in-out infinite alternate; }
  .fish.talking { animation: talk .28s ease-in-out infinite alternate; }
  @keyframes swim { 0%,100% { transform: translateY(0) rotate(-1deg) } 50% { transform: translateY(-9px) rotate(1deg) } }
  @keyframes think { from { transform: translateY(0) scale(1) } to { transform: translateY(-4px) scale(1.03) } }
  @keyframes talk { from { transform: translateY(0) scale(1,1) } to { transform: translateY(-2px) scale(1.03,.97) } }
  .stats { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.9; text-align: left; }
  .stats b { color: var(--text); font-weight: 600; }
  .chiprow { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
    border-radius:999px; padding:5px 10px; font-size:11px; }
  .chat { display:flex; flex-direction:column; height: min(78vh, 820px); overflow:hidden; }
  .head { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .head strong { font-size:15px; }
  .head span { font-size:12px; color:var(--muted); }
  .msgs { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:flex-end; max-width:88%; }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .avatar { width:30px; height:30px; flex:none; border-radius:50%; background:var(--blue-2);
    display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; }
  .row.me .avatar { background:#3a4a63; }
  .bubble-msg { background:var(--panel-2); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .row.me .bubble-msg { background:#23436e; border-color:#31598d; }
  .composer { border-top:1px solid var(--line); padding:14px 16px; display:flex; gap:10px; }
  textarea { flex:1; resize:none; height:48px; border-radius:12px; border:1px solid var(--line);
    background:#0e1727; color:var(--text); padding:13px 14px; font:inherit; font-size:14px; outline:none; }
  textarea:focus { border-color:var(--blue); }
  button { border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:12px;
    padding:0 18px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.send { background:var(--blue-2); border-color:var(--blue); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 14px; }
  .tools button { padding:6px 10px; font-size:12px; color:var(--muted); }
  .err { color:var(--red); font-size:12px; padding:0 16px 8px; min-height:16px; }
  @media (max-width: 820px) {
    .shell { grid-template-columns:1fr; padding:14px; }
    .tank { position:static; }
    .chat { height:70vh; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="card tank">
    <h1>胖蓝 · 大肥鱼</h1>
    <div class="sub">Gemini 驱动，省着吃 token</div>
    <div class="fish-wrap">
      <div class="bubble" style="left:24px;bottom:0;width:12px;height:12px;animation-delay:0s"></div>
      <div class="bubble" style="left:64px;bottom:0;width:8px;height:8px;animation-delay:1.4s"></div>
      <div class="bubble" style="right:38px;bottom:0;width:15px;height:15px;animation-delay:2.8s"></div>
      <svg class="fish" id="fish" viewBox="0 0 200 130" aria-label="一条蓝色胖鱼">
        <ellipse cx="96" cy="68" rx="70" ry="43" fill="#3a8ede"/>
        <ellipse cx="92" cy="60" rx="62" ry="34" fill="#59b0ff" opacity=".65"/>
        <path d="M158 68 L192 38 Q186 68 192 98 Z" fill="#2d6fd1"/>
        <path d="M92 28 Q112 6 124 30 Z" fill="#2d6fd1"/>
        <path d="M84 106 Q100 124 116 104 Z" fill="#2d6fd1"/>
        <circle cx="54" cy="58" r="8" fill="#f4fbff"/>
        <circle cx="52" cy="58" r="4" fill="#12233c"/>
        <path d="M30 78 Q44 88 58 77" stroke="#174a80" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="40" cy="70" rx="9" ry="5" fill="#7fc4ff" opacity=".5"/>
        <circle cx="128" cy="48" r="5" fill="#8fd0ff" opacity=".35"/>
        <circle cx="138" cy="62" r="4" fill="#8fd0ff" opacity=".25"/>
      </svg>
    </div>
    <div class="stats">
      <div>模型：<b id="model">-</b></div>
      <div>调用：<b id="calls">0</b> 次　本次输入：<b id="tokens">0</b> token</div>
      <div>累计输入：<b id="totalIn">0</b>　累计输出：<b id="totalOut">0</b></div>
      <div>状态：<b id="rel">刚认识</b> · <b id="mood">平静</b></div>
      <div class="chiprow" id="traits"></div>
    </div>
    <div class="chiprow" id="facts"></div>
  </aside>

  <main class="card chat">
    <div class="head"><strong>鱼塘</strong><span>本地运行 · Key 不进浏览器</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="err" id="err"></div>
    <div class="tools">
      <button data-cmd="记住：">记住</button>
      <button data-cmd="/记忆">看记忆</button>
      <button data-cmd="/状态">看用量</button>
      <button data-cmd="/清空">清对话</button>
      <button data-cmd="/进化">看提案</button>
      <button data-cmd="/采纳">采纳</button>
      <button data-cmd="/否决">否决</button>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="跟胖蓝说两句……（Ctrl+Enter 发送）"></textarea>
      <button class="send" id="send">投喂</button>
    </div>
  </main>
</div>

<script>
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const errBox = document.getElementById('err');
const fish = document.getElementById('fish');

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'row' + (role === 'user' ? ' me' : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : '蓝';
  const bubble = document.createElement('div');
  bubble.className = 'bubble-msg';
  bubble.textContent = text;
  row.append(avatar, bubble);
  msgs.append(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderFacts(facts) {
  const box = document.getElementById('facts');
  box.innerHTML = '';
  (facts || []).slice(-6).forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = f;
    box.append(chip);
  });
}

function renderEvolve(evolve, pending) {
  if (!evolve) return;
  document.getElementById('rel').textContent = evolve.relationship || '刚认识';
  document.getElementById('mood').textContent = evolve.mood || '平静';
  const box = document.getElementById('traits');
  box.innerHTML = '';
  Object.entries(evolve.traits || {}).forEach(([name, value]) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = name + ' ' + value + '/10';
    box.append(chip);
  });
  if (pending) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = '有进化提案待确认';
    box.append(chip);
  }
}

function renderUsage(total, current) {
  if (total) {
    document.getElementById('calls').textContent = total.calls ?? 0;
    document.getElementById('totalIn').textContent = total.prompt_tokens ?? 0;
    document.getElementById('totalOut').textContent = total.output_tokens ?? 0;
  }
  if (current) document.getElementById('tokens').textContent = current.prompt_tokens ?? 0;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function send(text) {
  const message = (text || input.value).trim();
  if (!message) return;
  input.value = '';
  errBox.textContent = '';
  addMsg('user', message);
  fish.className = 'fish thinking';
  try {
    const data = await api('/api/chat', {message});
    fish.className = 'fish talking';
    addMsg('fish', data.reply || '（没说话）');
    renderUsage(data.usage_total, data.usage);
    renderFacts(data.facts);
    renderEvolve(data.evolve, data.pending);
    if (data.error) errBox.textContent = '调用异常：' + data.error;
    setTimeout(() => { fish.className = 'fish'; }, 900);
  } catch (e) {
    fish.className = 'fish';
    errBox.textContent = '连不上本地服务：' + e.message;
  }
}

document.getElementById('send').onclick = () => send();
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
document.querySelectorAll('.tools button').forEach(btn => {
  btn.onclick = () => {
    const cmd = btn.dataset.cmd;
    if (cmd === '记住：') {
      const fact = prompt('要记住什么？');
      if (fact) send('记住：' + fact.trim());
    } else {
      send(cmd);
    }
  };
});

(async () => {
  try {
    const res = await fetch('/api/state');
    const state = await res.json();
    document.getElementById('model').textContent = state.model;
    renderUsage(state.usage, null);
    renderFacts(state.facts);
    renderEvolve(state.evolve, state.pending);
    (state.history || []).forEach(t => addMsg(t.role === 'user' ? 'user' : 'fish', t.text));
    addMsg('fish', '我游过来了。有事说话，没事也能摸鱼。');
  } catch (e) {
    errBox.textContent = '读取状态失败：' + e.message;
  }
})();
</script>
</body>
</html>
