<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini 娘 · 四角星猫耳</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #131d2e;
    --panel-2: #1a273c;
    --line: #2b3b54;
    --text: #e8f0fa;
    --muted: #93a6c0;
    --blue: #53a8ff;
    --blue-2: #2d6fd1;
    --red: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1100px 600px at 12% -10%, #17325a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(0,0,0,.28);
  }
  .tank {
    padding: 22px;
    text-align: center;
    position: sticky;
    top: 28px;
  }
  .tank h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  .tank .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .fish-wrap { position: relative; height: 210px; overflow: hidden; border-radius: 14px;
    background: radial-gradient(circle at 50% 26%, #2b2454 0%, #16203b 58%, #0d1526 100%); border: 1px solid var(--line); }
  .bubble { position:absolute; border-radius:50%; background:#c9b8ff; opacity:.35;
    box-shadow:0 0 8px #a98bff; animation: rise 7s linear infinite; }
  @keyframes rise { from { transform: translateY(30px) scale(.6); opacity:0 } 30% {opacity:.5} to { transform: translateY(-190px) scale(1); opacity:0 } }
  .fish { width: 178px; height: 178px; margin: 14px auto 0; display:block; object-fit: cover;
    border-radius: 22px; background:#ffffff; border: 2px solid rgba(185,139,255,.55);
    box-shadow: 0 10px 30px rgba(90,47,176,.45); animation: swim 4.2s ease-in-out infinite; transform-origin: center; }
  .fish.thinking { animation: think .5s ease-in-out infinite alternate; }
  .fish.talking { animation: talk .28s ease-in-out infinite alternate; }
  @keyframes swim { 0%,100% { transform: translateY(0) rotate(-1deg) } 50% { transform: translateY(-9px) rotate(1deg) } }
  @keyframes think { from { transform: translateY(0) scale(1) } to { transform: translateY(-4px) scale(1.03) } }
  @keyframes talk { from { transform: translateY(0) scale(1,1) } to { transform: translateY(-2px) scale(1.03,.97) } }
  .credit { font-size:10px; color:var(--muted); opacity:.7; margin-top:7px; letter-spacing:.2px; }
  .stats { margin-top: 16px; font-size: 13px; color: var(--muted); line-height: 1.9; text-align: left; }
  .stats b { color: var(--text); font-weight: 600; }
  .chiprow { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
    border-radius:999px; padding:5px 10px; font-size:11px; }
  .chat { display:flex; flex-direction:column; height: min(78vh, 820px); overflow:hidden; }
  .head { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .head strong { font-size:15px; }
  .head span { font-size:12px; color:var(--muted); }
  .msgs { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; align-items:flex-end; max-width:88%; }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .avatar { width:30px; height:30px; flex:none; border-radius:50%; background:var(--blue-2);
    display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; }
  .row.me .avatar { background:#3a4a63; }
  .bubble-msg { background:var(--panel-2); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .row.me .bubble-msg { background:#23436e; border-color:#31598d; }
  .composer { border-top:1px solid var(--line); padding:14px 16px; display:flex; gap:10px; }
  textarea { flex:1; resize:none; height:48px; border-radius:12px; border:1px solid var(--line);
    background:#0e1727; color:var(--text); padding:13px 14px; font:inherit; font-size:14px; outline:none; }
  textarea:focus { border-color:var(--blue); }
  button { border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:12px;
    padding:0 18px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.send { background:var(--blue-2); border-color:var(--blue); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 14px; }
  .tools button { padding:6px 10px; font-size:12px; color:var(--muted); }
  .err { color:var(--red); font-size:12px; padding:0 16px 8px; min-height:16px; }
  .typing { color:var(--muted); font-size:12px; padding:0 16px 8px; }
  .typing[hidden] { display:none; }
  .toolevent { align-self:center; max-width:80%; font-size:11px; color:var(--muted);
    background:var(--panel-2); border:1px dashed var(--line); border-radius:999px;
    padding:4px 10px; text-align:center; }
  @media (max-width: 820px) {
    .shell { grid-template-columns:1fr; padding:14px; }
    .tank { position:static; }
    .chat { height:70vh; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="card tank">
    <h1>Gemini 娘</h1>
    <div class="sub">四角星猫耳 · 住在屏幕里</div>
    <div class="fish-wrap">
      <div class="bubble" style="left:24px;bottom:0;width:12px;height:12px;animation-delay:0s"></div>
      <div class="bubble" style="left:64px;bottom:0;width:8px;height:8px;animation-delay:1.4s"></div>
      <div class="bubble" style="right:38px;bottom:0;width:15px;height:15px;animation-delay:2.8s"></div>
      <img class="fish" id="fish" src="/gemini-avatar.png" alt="Gemini 娘：紫色猫耳与四角星">
    </div>
    <div class="credit">形象 © ZipZipPipe · 非商业使用</div>
    <div class="stats">
      <div>模型：<b id="model">-</b></div>
      <div>调用：<b id="calls">0</b> 次　本次输入：<b id="tokens">0</b> token</div>
      <div>累计输入：<b id="totalIn">0</b>　累计输出：<b id="totalOut">0</b></div>
      <div>状态：<b id="rel">刚认识</b> · <b id="mood">平静</b></div>
      <div>相处：<b id="days">1</b> 天　聊过 <b id="msgCount">0</b> 句　好感 <b id="affection">0</b>/100</div>
      <div class="chiprow" id="traits"></div>
    </div>
    <div class="chiprow" id="facts"></div>
  </aside>

  <main class="card chat">
    <div class="head"><strong>聊天</strong><span id="headInfo">本地运行 · Key 不进浏览器</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="err" id="err"></div>
    <div class="typing" id="typing" hidden>Gemini 娘正在想……</div>
    <div class="tools">
      <button data-cmd="记住：">记住</button>
      <button data-cmd="/记忆">看记忆</button>
      <button data-cmd="/状态">看用量</button>
      <button data-cmd="/清空">清对话</button>
      <button data-cmd="/进化">看提案</button>
      <button data-cmd="/采纳">采纳</button>
      <button data-cmd="/否决">否决</button>
      <button data-cmd="/日记">日记</button>
      <button data-cmd="/关系">关系</button>
      <button data-cmd="/好感">好感</button>
      <button id="voiceBtn" type="button">语音：关</button>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="跟她说两句……（Ctrl+Enter 发送）"></textarea>
      <button class="send" id="send">投喂</button>
    </div>
  </main>
</div>

<script>
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const errBox = document.getElementById('err');
const fish = document.getElementById('fish');
const typing = document.getElementById('typing');
const seenInbox = new Set();

const MOOD_FACE = {
  '平静': 'calm', '开心': 'smile', '好奇': 'surprised', '犯困': 'closed_smile',
  '别扭': 'pout', '兴奋': 'smile', '安静': 'calm', '有点闷': 'sad'
};
let currentFace = 'smile';
function setFace(name) {
  if (!name || name === currentFace) return;
  currentFace = name;
  fish.src = '/expressions/' + name + '.png';
}
function faceFor(mood) { return MOOD_FACE[mood] || 'calm'; }
function faceForReply(reply, mood) {
  const t = String(reply || '');
  if (/哼|才不|懒得|别闹|讨厌/.test(t)) return 'pout';
  if (/哈哈|嘿嘿|笑死|逗你/.test(t)) return 'smile';
  if (/对不起|抱歉|算了|没意思/.test(t)) return 'sad';
  if (/真的吗|居然|竟然|！/.test(t)) return 'surprised';
  if (/晚安|睡吧|困/.test(t)) return 'closed_smile';
  return faceFor(mood);
}

const voiceBtn = document.getElementById('voiceBtn');
let voiceOn = localStorage.getItem('fishVoice') === 'on';
function paintVoiceBtn() { voiceBtn.textContent = '语音：' + (voiceOn ? '开' : '关'); }
paintVoiceBtn();
voiceBtn.onclick = () => {
  voiceOn = !voiceOn;
  localStorage.setItem('fishVoice', voiceOn ? 'on' : 'off');
  paintVoiceBtn();
  if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
};

fish.style.cursor = 'pointer';
fish.title = '点一下试试';
fish.onclick = () => {
  const pool = ['smile', 'shy', 'pout', 'surprised', 'closed_smile'];
  setFace(pool[Math.floor(Math.random() * pool.length)]);
  setTimeout(() => setFace(faceFor(document.getElementById('mood').textContent)), 2600);
};

function speak(text) {
  if (!voiceOn || !text || !window.speechSynthesis) return;
  const clean = String(text)
    .split('\n\n（')[0]
    .replace(/[（(][^）)]{0,80}[）)]/g, '')
    .replace(/[`*_#>]/g, '')
    .trim();
  if (!clean) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean.slice(0, 200));
  const voices = speechSynthesis.getVoices().filter(v => /zh|Chinese/i.test(v.lang + ' ' + v.name));
  const pick = voices.find(v => /Xiaoxiao|Yaoyao|Ting|女|Female/i.test(v.name)) || voices[0];
  if (pick) u.voice = pick;
  u.lang = 'zh-CN';
  u.rate = 1.04;
  u.pitch = 1.12;
  speechSynthesis.speak(u);
}

function addMsg(role, text) {
  const row = document.createElement('div');
  row.className = 'row' + (role === 'user' ? ' me' : '');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'G';
  const bubble = document.createElement('div');
  bubble.className = 'bubble-msg';
  bubble.textContent = text;
  row.append(avatar, bubble);
  msgs.append(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderToolEvents(events) {
  (events || []).forEach(ev => {
    const el = document.createElement('div');
    el.className = 'toolevent';
    el.textContent = '用了工具 ' + ev.name + '：' + String(ev.result || '').slice(0, 90);
    msgs.append(el);
  });
  if (events && events.length) msgs.scrollTop = msgs.scrollHeight;
}

function renderFacts(facts) {
  const box = document.getElementById('facts');
  box.innerHTML = '';
  (facts || []).slice(-6).forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = f;
    box.append(chip);
  });
}

function renderEvolve(evolve, pending) {
  if (!evolve) return;
  document.getElementById('rel').textContent = evolve.relationship || '刚认识';
  document.getElementById('mood').textContent = evolve.mood || '平静';
  const box = document.getElementById('traits');
  box.innerHTML = '';
  Object.entries(evolve.traits || {}).forEach(([name, value]) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = name + ' ' + value + '/10';
    box.append(chip);
  });
  if (pending) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = '有进化提案待确认';
    box.append(chip);
  }
}

function renderStats(state) {
  const s = state.stats || {};
  document.getElementById('days').textContent = state.days ?? 1;
  document.getElementById('msgCount').textContent = s.messages ?? 0;
  document.getElementById('affection').textContent = s.affection ?? 0;
}

async function renderInbox(items) {
  if (!items || !items.length) return;
  const fresh = items.filter(item => !seenInbox.has(item.id));
  fresh.forEach(item => {
    seenInbox.add(item.id);
    addMsg('fish', item.text);
    setFace('surprised');
    speak(item.text);
    setTimeout(() => setFace(faceFor(document.getElementById('mood').textContent)), 5000);
  });
  await api('/api/inbox/seen', {ids: items.map(item => item.id)});
}

async function pollState() {
  try {
    const res = await fetch('/api/state');
    const state = await res.json();
    renderEvolve(state.evolve, state.pending);
    renderStats(state);
    renderInbox(state.inbox);
    document.getElementById('headInfo').textContent =
      (state.evolve_mode === 'auto' ? '自动进化' : '确认进化') + ' · Key 不进浏览器';
  } catch (e) { /* 静默重试 */ }
}

function renderUsage(total, current) {
  if (total) {
    document.getElementById('calls').textContent = total.calls ?? 0;
    document.getElementById('totalIn').textContent = total.prompt_tokens ?? 0;
    document.getElementById('totalOut').textContent = total.output_tokens ?? 0;
  }
  if (current) document.getElementById('tokens').textContent = current.prompt_tokens ?? 0;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function send(text) {
  const message = (text || input.value).trim();
  if (!message) return;
  input.value = '';
  errBox.textContent = '';
  addMsg('user', message);
  fish.className = 'fish thinking';
  setFace('serious');
  typing.hidden = false;
  try {
    const data = await api('/api/chat', {message});
    fish.className = 'fish talking';
    renderToolEvents(data.tool_events);
    addMsg('fish', data.reply || '（没说话）');
    setFace(faceForReply(data.reply, (data.evolve || {}).mood));
    speak(data.reply);
    renderUsage(data.usage_total, data.usage);
    renderFacts(data.facts);
    renderEvolve(data.evolve, data.pending);
    if (data.error) errBox.textContent = '调用异常：' + data.error;
    typing.hidden = true;
    pollState();
    setTimeout(() => { fish.className = 'fish'; }, 900);
  } catch (e) {
    fish.className = 'fish';
    setFace('sad');
    typing.hidden = true;
    errBox.textContent = '连不上本地服务：' + e.message;
  }
}

document.getElementById('send').onclick = () => send();
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
document.querySelectorAll('.tools button').forEach(btn => {
  if (btn.id === 'voiceBtn') return;
  btn.onclick = () => {
    const cmd = btn.dataset.cmd;
    if (cmd === '记住：') {
      const fact = prompt('要记住什么？');
      if (fact) send('记住：' + fact.trim());
    } else {
      send(cmd);
    }
  };
});

(async () => {
  try {
    const res = await fetch('/api/state');
    const state = await res.json();
    document.getElementById('model').textContent = state.model;
    renderUsage(state.usage, null);
    renderFacts(state.facts);
    renderEvolve(state.evolve, state.pending);
    renderStats(state);
    setFace(faceFor((state.evolve || {}).mood));
    renderInbox(state.inbox);
    document.getElementById('headInfo').textContent =
      (state.evolve_mode === 'auto' ? '自动进化' : '确认进化') + ' · Key 不进浏览器';
    (state.history || []).forEach(t => addMsg(t.role === 'user' ? 'user' : 'fish', t.text));
    addMsg('fish', '我在这儿。有事说，没事也能一起发会儿呆。');
  } catch (e) {
    errBox.textContent = '读取状态失败：' + e.message;
  }
})();
setInterval(pollState, 15000);
</script>
</body>
</html>
